---
# ============================================================
# Bitbucket Data Center - Installation Dispatcher
# ============================================================

- name: Validate Bitbucket installation method
  ansible.builtin.assert:
    that:
      - bitbucket_install_method in ['installer', 'archive']
    fail_msg: >-
      Unsupported bitbucket_install_method:
      {{ bitbucket_install_method }}.
      Supported methods are installer and archive.

- name: Install Bitbucket using Linux binary installer
  ansible.builtin.include_tasks: install_installer.yml
  when: bitbucket_install_method == 'installer'

- name: Install Bitbucket using archive
  ansible.builtin.include_tasks: install_archive.yml
  when: bitbucket_install_method == 'archive'
